
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>評分遊戲</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #2563eb;
    }
    .hidden { display: none; }
    ul { padding-left: 20px; }
    li { margin-bottom: 5px; }
  </style>
</head>
<body>

<div class="container">
  <div id="name-section">
    <h2>歡迎參與評分遊戲</h2>
    <input type="text" id="username" placeholder="請輸入你的名字">
    <button onclick="startGame()">開始</button>
  </div>

  <div id="score-section" class="hidden">
    <h3 id="round-title"></h3>
    <input type="number" id="score" min="1" max="9" placeholder="請輸入 1 到 9 分">
    <button onclick="submitScore()">提交評分</button>
  </div>

  <div id="result-section" class="hidden">
    <h3 id="result-title"></h3>
    <ul id="score-list"></ul>
    <button onclick="restart()">重新開始</button>
  </div>
</div>

<script>
  const totalRounds = 6;
  let currentRound = 1;
  let scores = [];
  let userName = "";

  function startGame() {
    const nameInput = document.getElementById("username");
    userName = nameInput.value.trim();
    if (!userName) return alert("請輸入名字！");

    document.getElementById("name-section").classList.add("hidden");
    document.getElementById("score-section").classList.remove("hidden");
    updateRoundTitle();
  }

  function updateRoundTitle() {
    document.getElementById("round-title").textContent = `第 ${currentRound} 回合，${userName} 請輸入 1 到 9 分：`;
    document.getElementById("score").value = "";
  }

  function submitScore() {
    const scoreInput = document.getElementById("score");
    const value = parseInt(scoreInput.value, 10);
    if (isNaN(value) || value < 1 || value > 9) {
      alert("請輸入有效的 1 到 9 分");
      return;
    }

    scores.push(value);
    currentRound++;

    if (currentRound > totalRounds) {
      showResults();
    } else {
      updateRoundTitle();
    }
  }

  function showResults() {
    document.getElementById("score-section").classList.add("hidden");
    document.getElementById("result-section").classList.remove("hidden");
    document.getElementById("result-title").textContent = `謝謝你，${userName}！以下是你的評分：`;

    const list = document.getElementById("score-list");
    list.innerHTML = "";
    scores.forEach((score, index) => {
      const li = document.createElement("li");
      li.textContent = `第 ${index + 1} 回合：${score} 分`;
      list.appendChild(li);
    });
  }

  function restart() {
    currentRound = 1;
    scores = [];
    userName = "";
    document.getElementById("username").value = "";
    document.getElementById("name-section").classList.remove("hidden");
    document.getElementById("score-section").classList.add("hidden");
    document.getElementById("result-section").classList.add("hidden");
  }
</script>

</body>
</html>
